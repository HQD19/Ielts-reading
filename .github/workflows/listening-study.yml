name: Listening study checks
on:
  push:
    paths:
      - 'src/**'
      - 'ui_template.py'
      - 'build.py'
      - 'build_listening.py'
      - 'listening_corrections.py'
      - 'data/listening/**'
      - 'data/books/**'
      - 'tests/**'
      - '.github/workflows/listening-study.yml'
permissions:
  contents: write
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - name: Build both standalone screens
        run: python3 build.py
      - name: Install browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test Listening study tools
        run: node tests/listening-study.mjs
      - name: Test shared UI and Reading regression
        run: node tests/shared-ui.mjs
      - name: Test reflowed Listening text and font size
        run: node tests/listening-flow.mjs
      - name: Upload interface screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-ui-screenshots
          path: test-results/
          if-no-files-found: ignore
      - name: Save verified standalone builds
        if: github.ref == 'refs/heads/codex/unified-skill-template'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html listening.html
          if ! git diff --cached --quiet; then
            git commit -m "Build Reading and Listening with shared UI template"
            git push origin HEAD
          fi
