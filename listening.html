$('#settings').onclick=()=>{dialog('<h2>Góc luyện Listening</h2><p>60 test · Cambridge 7–21 · 2.400 câu hỏi. Đề giữ nguyên bản quét. 56 test có khóa chấm; Cambridge 20 thiếu khóa trong PDF đầu vào.</p><p class="hint">Tiến độ Listening lưu riêng với Reading. Audio tải theo bài nghe đang chọn.</p><div class="toolbar"><button id="export">Xuất tiến độ JSON</button><label class="button" for="import">Khôi phục JSON</label><input type="file" id="import" accept=".json" hidden><button id="reset">Làm lại test</button></div><p class="hint">Nhập chữ cái cho trắc nghiệm/matching. Nhóm IN EITHER ORDER được chấm không phụ thuộc thứ tự và không tính trùng. Chấm tham khảo bỏ qua hoa/thường, dấu cách và gạch nối; kiểm tra giới hạn từ theo đề gốc.</p>','<button data-close>Đóng</button>');$('#export').onclick=()=>{persist();const url=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='listening-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};$('#import').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>10000000)throw Error('File quá lớn.');const imported=cleanStore(JSON.parse(await f.text()));pause();db=imported;current=TESTS.find(t=>t.id===db.current);part=db.part;tab='sheet';audioKey='';audioOwner='';persist();$('#dialog').close();render();toast('Đã khôi phục Listening.');}catch(err){toast(err.message);}};$('#reset').onclick=()=>{pause();$('#dialog').close();dialog('<h2>Làm lại test?</h2><p>Câu trả lời, điểm và cờ xem lại của test này sẽ được đặt lại.</p>','<button data-close>Quay lại</button><button class="primary" id="confirm-reset">Làm lại</button>');$('#confirm-reset').onclick=()=>{const duration=state().duration;db.states[current.id]=fresh();state().duration=duration;state().remaining=duration;part=1;tab='sheet';audioKey='';audioOwner='';$('#dialog').close();persist();render();};};};
window.addEventListener('beforeunload',persist);setInterval(tick,250);setInterval(persist,5000);render();persist();
