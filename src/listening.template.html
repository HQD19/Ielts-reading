<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reading Room · Listening</title><style>/*__SHARED_UI_CSS__*/

@media(max-width:600px){.listening-app{height:100dvh;min-height:620px;overflow:hidden}.listening-app .workspace{display:flex;flex-direction:column;overflow:auto}.listening-app .pane{height:58dvh;min-height:400px;flex-shrink:0}.listening-app .source-pane{border-right:0;border-bottom:2px solid var(--line)}.listening-app .footer{height:90px;min-height:90px;padding:8px 10px}.listening-app .palette{grid-template-columns:repeat(10,minmax(0,1fr));gap:3px}.listening-app .palette button{height:16px;font-size:9px}.listening-app .key-columns{grid-template-columns:1fr}}

.listening-app #source-scroll{padding:34px 36px 65px}

.source-word{white-space:normal}.source-gap{display:inline-flex;max-width:100%;gap:.25em;align-items:baseline;vertical-align:baseline}.source-gap .source-word{flex-shrink:0;font-weight:700}.source-gap .answer-space{flex:0 1 4.5em;min-width:1em}.source-decoration{display:none}.answer-space{display:inline-block;width:4.5em;max-width:100%;height:.8em;overflow:hidden;vertical-align:baseline;border-bottom:1px solid var(--muted);line-height:0;white-space:nowrap;color:transparent;user-select:none}

.flow-table th{background:var(--soft);font-weight:700}.flow-diagram{font:12px/1.6 var(--ui-font);border:1px solid var(--line);border-radius:8px;padding:12px;margin:24px 0}
.flow-diagram .ocr-page{margin-top:16px;user-select:none}.flow-diagram .ocr-text{user-select:none}

</style></head><body><div class="app listening-app" id="app"><!--__HEADER_ACTIONS_START__--><label class="sr" for="book">Chọn sách Cambridge</label><select class="test-select book-select" id="book"></select><label class="sr" for="test">Chọn test</label><select class="test-select" id="test"></select><button class="icon-btn" id="theme" aria-label="Đổi chế độ sáng tối" title="Sáng / Tối">☾</button><button class="icon-btn" id="settings" aria-label="Cài đặt và sao lưu" title="Cài đặt và sao lưu">⚙</button><!--__HEADER_ACTIONS_END__--><section class="sessionbar"><nav class="passage-tabs" id="parts" aria-label="Phần bài nghe"></nav><div class="timer-box"><label class="sr" for="duration">Thời gian làm bài</label><select class="test-select" id="duration" title="Chọn trước khi bắt đầu"></select><div><div class="timer-label">THỜI GIAN CÒN LẠI</div><div class="timer-digits" id="timer">30:00</div></div><button class="timer-control" id="timer-toggle" aria-label="Bắt đầu đồng hồ">▶</button></div><div class="session-actions"><button class="primary" id="submit"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg><span>Nộp bài</span></button></div></section><section class="listening-audio-panel" aria-label="Listening audio" style="flex-shrink:0;padding:10px 24px;border-bottom:1px solid var(--line);background:var(--paper,#fff);max-height:28vh;overflow:auto"><div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><strong id="listening-audio-label"></strong><audio id="listening-audio" controls preload="metadata" style="max-width:100%;height:36px" aria-label="Part audio"></audio><button class="secondary" data-audio-skip="-10" aria-label="Back 10 seconds">-10s</button><button class="secondary" data-audio-skip="10" aria-label="Forward 10 seconds">+10s</button><button class="secondary" id="listening-audio-replay">Replay</button><label>Speed <select id="listening-audio-speed"><option value="0.75">0.75x</option><option value="1" selected>1x</option><option value="1.25">1.25x</option><option value="1.5">1.5x</option></select></label><label class="secondary">Choose Part audio <input id="listening-audio-file" type="file" accept="audio/*" style="max-width:190px"></label></div><small id="listening-audio-status" role="status"></small></section><main class="workspace"><section class="pane source-pane"><div class="pane-bar"><div class="pane-eyebrow" id="source-caption"></div><div class="source-tools"><button id="lookup-open" aria-label="Tra từ nhanh" title="Tra từ hoặc cụm từ">Tra từ</button><button id="zoom-out" aria-label="Giảm cỡ chữ đề bài" title="Giảm cỡ chữ">A−</button><output id="font-size" aria-live="polite">18px</output><button id="zoom-in" aria-label="Tăng cỡ chữ đề bài" title="Tăng cỡ chữ">A+</button></div></div><div class="scroll" id="source-scroll"><div class="pages" id="pages"></div></div></section><section class="pane answer-pane"><nav class="pane-bar tabs" aria-label="Nội dung bên phải"><button id="tab-sheet" class="tab active">Làm bài</button><button id="tab-key" class="tab">Đáp án &amp; đối chiếu</button></nav><div class="scroll" id="answer-scroll"><div class="right-content"><div class="eyebrow" id="eyebrow"></div><h1 class="listening-title">Listen. Notice. Understand.</h1><div class="panel-intro"><p>IELTS LISTENING · PHIẾU TRẢ LỜI</p><span class="panel-number" id="progress"></span></div><div id="content"></div></div></div></section></main><footer class="footer"><div class="footer-label"><strong>CÂU HỎI · LISTENING</strong><div class="legend"><span><i class="done"></i>Đã trả lời</span><span><i class="review"></i>Xem lại</span></div></div><nav class="palette" id="palette" aria-label="Chuyển câu hỏi"></nav></footer><dialog id="dialog"><div id="dialog-content"></div></dialog><div id="toast" role="status" hidden></div><div id="selection-tools" class="study-floating selection-tools" role="toolbar" aria-label="Thao tác với văn bản đã chọn" hidden><button id="selection-mark">Tô sáng</button><button id="selection-lookup">Tra từ</button><button id="selection-remove">Bỏ highlight</button></div><aside id="word-lookup" class="study-floating lookup-popup" aria-label="Tra từ Listening" hidden><div class="lookup-top"><strong>Tra từ nhanh</strong><button id="lookup-close" aria-label="Đóng bảng tra từ">×</button></div><form id="lookup-form"><label class="sr" for="lookup-query">Từ hoặc cụm từ cần tra</label><input id="lookup-query" maxlength="100" placeholder="Nhập từ hoặc cụm từ…" autocomplete="off"><button class="primary" type="submit">Tra</button></form><div id="lookup-results" aria-live="polite"></div><a id="lookup-cambridge" class="lookup-external" href="https://dictionary.cambridge.org/dictionary/english/" target="_blank" rel="noopener noreferrer">Mở từ điển Cambridge ↗</a></aside><script src="src/listening-audio.js"></script><script>
'use strict';
const TESTS=/*__LISTENING_DATA__*/;
const STORE='reading-room:listening:v1';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[’']/g,'').replace(/(?<=\d),(?=\d)/g,'').replace(/[\s\-–—]+/g,'').replace(/[.!?;:]+$/,'');
const fresh=()=>({answers:{},flags:[],highlights:[],duration:1800,remaining:1800,started:false,running:false,deadline:null,graded:false,revealed:false});
function cleanState(raw,test){const s=fresh();if(!raw||typeof raw!=='object')return s;s.highlights=sanitizeHighlights(raw.highlights,test);for(let n=1;n<=40;n++)if(typeof raw.answers?.[n]==='string')s.answers[n]=raw.answers[n].slice(0,180);s.flags=Array.isArray(raw.flags)?[...new Set(raw.flags.filter(n=>Number.isInteger(n)&&n>=1&&n<=40))]:[];s.duration=Number.isInteger(raw.duration)&&raw.duration>=600&&raw.duration<=3600&&raw.duration%60===0?raw.duration:1800;s.remaining=Number.isFinite(raw.remaining)?Math.max(0,Math.min(s.duration,raw.remaining)):s.duration;s.started=!!raw.started;s.graded=!!raw.graded;s.revealed=!!raw.revealed;s.running=!!raw.running&&!s.graded&&Number.isFinite(raw.deadline);s.deadline=s.running?raw.deadline:null;return s;}
function cleanStore(raw){const out={version:1,current:TESTS[0].id,part:1,fontSize:18,states:{}};if(!raw||raw.version!==1)throw Error('Bản sao lưu không phù hợp.');if(TESTS.some(t=>t.id===raw.current))out.current=raw.current;if([1,2,3,4].includes(raw.part))out.part=raw.part;if(Number.isInteger(raw.fontSize)&&raw.fontSize>=14&&raw.fontSize<=28)out.fontSize=raw.fontSize;for(const t of TESTS)if(raw.states?.[t.id])out.states[t.id]=cleanState(raw.states[t.id],t);return out;}
let db;try{db=cleanStore(JSON.parse(localStorage.getItem(STORE)));}catch{db=cleanStore({version:1});}
let current=TESTS.find(t=>t.id===db.current),part=db.part,tab='sheet',toastId,saveFailed=false;
const state=()=>db.states[current.id]??=fresh(),remaining=()=>state().running?Math.max(0,(state().deadline-Date.now())/1000):state().remaining;
const time=s=>String(Math.floor(Math.max(0,s)/60)).padStart(2,'0')+':'+String(Math.floor(Math.max(0,s)%60)).padStart(2,'0');
function toast(text){$('#toast').textContent=text;$('#toast').hidden=false;clearTimeout(toastId);toastId=setTimeout(()=>$('#toast').hidden=true,4000);}
function persist(){db.current=current.id;db.part=part;try{localStorage.setItem(STORE,JSON.stringify(db));}catch{if(!saveFailed){saveFailed=true;toast('Không lưu được. Hãy xuất JSON ở Cài đặt.');}}}
function grade(test=current,s=state()){const out={};for(const q of test.answers)out[q.n]=q.answer?!!s.answers[q.n]?.trim()&&q.accept.some(a=>norm(a)===norm(s.answers[q.n])):null;for(const g of test.groups){const available=g.answers.map(norm);for(const n of g.questions){const i=available.indexOf(norm(s.answers[n]));out[n]=i>=0;if(i>=0)available.splice(i,1);}}return out;}
const answered=()=>Object.values(state().answers).filter(v=>v.trim()).length;
function progress(){const s=state(),r=s.graded?grade():{};$('#progress').textContent=answered()+' / 40';$('#palette').innerHTML=Array.from({length:40},(_,i)=>{const n=i+1;return '<button data-q="'+n+'" class="'+(s.answers[n]?.trim()?'filled ':'')+(s.flags.includes(n)?'flagged ':'')+(Math.ceil(n/10)===part?'current ':'')+(s.graded&&r[n]!==null?(r[n]?'correct':'wrong'):'')+'" aria-label="Câu '+n+'">'+n+'</button>';}).join('');}
function tick(){const s=state(),r=remaining();$('#timer').textContent=time(r);$('#timer').classList.toggle('low',r<=120);$('#duration').value=String(s.duration/60);$('#duration').disabled=s.started||s.graded;$('#timer-toggle').textContent=s.running?'Ⅱ':'▶';$('#timer-toggle').disabled=s.graded;$('#timer-toggle').setAttribute('aria-label',s.running?'Tạm dừng đồng hồ':'Bắt đầu hoặc tiếp tục đồng hồ');if(s.running&&r<=0)finish();}
function pause(){if(state().running){state().remaining=remaining();state().running=false;state().deadline=null;}persist();tick();}
function toggleTimer(){const s=state();if(s.graded)return;if(s.running){pause();return;}if(s.remaining<=0){finish();return;}s.started=true;s.running=true;s.deadline=Date.now()+s.remaining*1000;persist();tick();}
function dialog(body,actions){$('#dialog-content').innerHTML=body+'<div class="dialog-actions">'+actions+'</div>';$('#dialog').showModal();}
function finish(){const s=state();if(s.graded)return;s.remaining=remaining();s.running=false;s.deadline=null;s.graded=true;persist();tab='key';renderContent();progress();tick();setSubmitLabel('Xem kết quả');}
function requestSubmit(){if(state().graded){tab='key';renderContent();return;}dialog('<h2>Nộp bài Listening?</h2><p>Đã trả lời '+answered()+'/40 câu. Sau khi nộp, bài được khóa để xem kết quả.</p>','<button data-close>Tiếp tục làm</button><button class="primary" id="confirm-submit">Nộp &amp; xem kết quả</button>');$('#confirm-submit').onclick=()=>{$('#dialog').close();finish();};}
function layoutSvg(layout,label,page=0){
 if(!layout)return '<p class="notice">Chưa có bố cục OCR cho trang này.</p>';
 const lines=[];
 for(const [runIndex,base]of layout.runs.entries()){const r=base.slice();r.runIndex=runIndex;let line=lines.find(l=>Math.abs(l.y-r[2])<Math.min(7,r[4]*.28));if(!line){line={y:r[2],words:[]};lines.push(line);}line.words.push(r);}
 const runs=lines.sort((a,b)=>a.y-b.y).map(l=>'<text>'+l.words.sort((a,b)=>a[1]-b[1]).map(r=>'<tspan data-page="'+page+'" data-run="'+r.runIndex+'" x="'+r[1]+'" y="'+r[2]+'" font-size="'+r[4]+'" font-weight="'+(r[5]?'700':'400')+'" textLength="'+Math.max(2,r[3]+r[4]*.25)+'" lengthAdjust="spacingAndGlyphs">'+esc(r[0])+' </tspan>').join('')+'</text>').join('');
 const rules=(layout.rules||[]).map(r=>'<line x1="'+r[0]+'" y1="'+r[1]+'" x2="'+r[2]+'" y2="'+r[3]+'"/>').join('');
 return '<svg class="ocr-page" data-page="'+page+'" xmlns="http://www.w3.org/2000/svg" viewBox="'+layout.view.join(' ')+'" role="document" aria-label="'+esc(label)+'"><title>'+esc(label)+'</title><path d="'+layout.paths+'" fill="currentColor" fill-rule="evenodd" opacity=".7"/><g stroke="currentColor" stroke-width="1.3" opacity=".65">'+rules+'</g><g class="ocr-text" fill="currentColor">'+runs+'</g></svg>';
}
function renderSource(){
 $('#source-caption').textContent='CAM '+current.book+' · TEST '+current.sourceTest+' · PART '+part+' · CÂU '+(part*10-9)+'–'+part*10;
 $('#pages').innerHTML=current.pages.filter(p=>p.part===part).map(listeningFlowPage).join('');
 setListeningFont(db.fontSize);drawStudyHighlights();
}
function answerKeyTable(){return '<div class="key-columns">'+[[1,2],[3,4]].map(parts=>'<div>'+parts.map(p=>'<h3>Part '+p+' · '+(p*10-9)+'–'+p*10+'</h3><table>'+current.answers.filter(q=>Math.ceil(q.n/10)===p).map(q=>'<tr><th>'+q.n+'</th><td>'+esc(q.answer)+'</td></tr>').join('')+'</table>').join('')+'</div>').join('')+'</div>';}
function renderContent(){const s=state(),r=grade();$('#tab-sheet').classList.toggle('active',tab==='sheet');$('#tab-key').classList.toggle('active',tab==='key');if(tab==='sheet'){$('#content').innerHTML='<p class="hint">Đọc đề bên trái và nhập câu trả lời. Với trắc nghiệm/matching, nhập chữ cái. Tuân thủ giới hạn từ trong đề.</p>'+(current.sourceNote?'<div class="notice warn">'+esc(current.sourceNote)+'</div>':'')+current.groups.filter(g=>Math.ceil(g.questions[0]/10)===part).map(g=>'<div class="notice">Câu '+g.questions.join(', ')+': thứ tự bất kỳ; mỗi ô nhập một đáp án.</div>').join('')+'<h2>Part '+part+' · Câu '+(part*10-9)+'–'+part*10+'</h2>'+Array.from({length:10},(_,i)=>{const n=part*10-9+i;return '<div class="answer-row '+(s.graded&&r[n]!==null?(r[n]?'correct':'wrong'):'')+'" id="q-'+n+'"><label for="a-'+n+'">'+n+'</label><input id="a-'+n+'" data-answer="'+n+'" value="'+esc(s.answers[n]||'')+'" maxlength="180" autocomplete="off" spellcheck="false" aria-label="Câu trả lời '+n+'" '+(s.graded?'disabled':'')+'><button class="flag '+(s.flags.includes(n)?'on':'')+'" data-flag="'+n+'" aria-label="Đánh dấu câu '+n+'" aria-pressed="'+s.flags.includes(n)+'">⚑</button>'+(s.graded?'<div class="feedback">'+(r[n]===null?'Chưa có khóa đáp án.':r[n]?'Đúng':'Đáp án: '+esc(current.answers[n-1].answer))+'</div>':'')+'</div>';}).join('');return;}
const count=current.answers.filter(q=>q.answer).length,correct=Object.values(r).filter(x=>x===true).length;
$('#content').innerHTML=(s.graded?'<div class="score">'+correct+' / '+(count||'—')+'</div><p class="hint">'+time(s.duration-s.remaining)+' làm bài · '+answered()+'/40 đã trả lời'+(s.revealed?' · Đã xem đáp án trước khi nộp':'')+'. '+(count<40?'Chỉ chấm các câu có khóa đáp án.':'')+'</p>':'<div class="notice">Lượt luyện này đã được ghi nhận là có xem đáp án.</div>')+(count?'<p class="hint">Khóa chép từ PDF '+current.book+'.pdf, trang '+current.keyPage+'. Ngoặc chỉ phần tùy chọn; dấu / chỉ phương án chấp nhận. Các biến thể được đối chiếu theo khóa trong PDF.</p>'+current.groups.map(g=>'<p class="hint">Câu '+g.questions.join(', ')+': <b>'+esc(g.answers.join(' + '))+'</b>, thứ tự bất kỳ.</p>').join('')+current.answers.map(q=>'<div class="answer-row"><b>'+q.n+'</b><span>'+esc(q.answer)+'</span><span>'+(s.graded?(r[q.n]?'✓':'✕'):'')+'</span>'+(s.graded?'<div class="feedback">Bạn trả lời: '+esc(s.answers[q.n]||'—')+'</div>':'')+'</div>').join('')+'<details><summary>Khóa đáp án theo phần · trang '+current.keyPage+'</summary>'+answerKeyTable()+'</details>':'<div class="notice warn">'+esc(current.sourceNote)+'</div>');}
function setSubmitLabel(text){$('#submit span').textContent=text;}
function render(){syncListeningAudio();$('#book').innerHTML=[...new Set(TESTS.map(t=>t.book))].map(b=>'<option value="'+b+'" '+(b===current.book?'selected':'')+'>Cambridge '+b+'</option>').join('');$('#test').innerHTML=TESTS.filter(t=>t.book===current.book).map(t=>'<option value="'+t.id+'" '+(t.id===current.id?'selected':'')+'>Test '+t.sourceTest+'</option>').join('');$('#parts').innerHTML=[1,2,3,4].map(n=>'<button data-part="'+n+'" class="passage-tab '+(n===part?'active':'')+'" aria-current="'+(n===part?'page':'false')+'">Part '+n+'</button>').join('');$('#eyebrow').textContent='CAMBRIDGE '+current.book+' / TEST '+current.sourceTest;setSubmitLabel(state().graded?'Xem kết quả':'Nộp bài');renderSource();renderContent();progress();tick();}
function changeTest(id){closeStudyFloating();pause();current=TESTS.find(t=>t.id===id)||current;part=1;tab='sheet';persist();render();$('#source-scroll').scrollTop=0;$('#answer-scroll').scrollTop=0;}
function goPart(n){closeStudyFloating();part=n;persist();render();$('#source-scroll').scrollTop=0;$('#answer-scroll').scrollTop=0;}
$('#book').onchange=e=>changeTest(TESTS.find(t=>t.book===+e.target.value).id);$('#test').onchange=e=>changeTest(e.target.value);$('#parts').onclick=e=>{const b=e.target.closest('[data-part]');if(b)goPart(+b.dataset.part);};
$('#content').oninput=e=>{if(e.target.matches('[data-answer]')&&!state().graded){state().answers[e.target.dataset.answer]=e.target.value;persist();progress();}};
$('#content').onclick=e=>{const b=e.target.closest('[data-flag]');if(!b)return;const n=+b.dataset.flag;state().flags=state().flags.includes(n)?state().flags.filter(x=>x!==n):[...state().flags,n];b.classList.toggle('on',state().flags.includes(n));b.setAttribute('aria-pressed',String(state().flags.includes(n)));persist();progress();};
$('#palette').onclick=e=>{const b=e.target.closest('[data-q]');if(!b)return;const n=+b.dataset.q;tab='sheet';if(part!==Math.ceil(n/10))goPart(Math.ceil(n/10));else renderContent();$('#q-'+n).scrollIntoView({block:'center',behavior:'smooth'});$('#a-'+n).focus({preventScroll:true});};
$('#tab-sheet').onclick=()=>{tab='sheet';renderContent();};$('#tab-key').onclick=()=>{if(!state().graded&&!state().revealed){dialog('<h2>Xem đáp án?</h2><p>Lượt luyện này sẽ được đánh dấu là đã xem đáp án. Bạn vẫn có thể tiếp tục làm bài.</p>','<button data-close>Quay lại</button><button class="primary" id="reveal">Xem đáp án</button>');$('#reveal').onclick=()=>{$('#dialog').close();state().revealed=true;persist();tab='key';renderContent();};}else{tab='key';renderContent();}};
$('#duration').innerHTML=Array.from({length:51},(_,i)=>'<option value="'+(i+10)+'">'+(i+10)+' phút</option>').join('');$('#duration').onchange=e=>{if(state().started||state().graded)return;const n=+e.target.value;if(!Number.isInteger(n)||n<10||n>60)return;state().duration=n*60;state().remaining=n*60;persist();tick();};$('#timer-toggle').onclick=toggleTimer;$('#submit').onclick=requestSubmit;
$('#zoom-in').onclick=()=>setListeningFont(db.fontSize+2);$('#zoom-out').onclick=()=>setListeningFont(db.fontSize-2);
function theme(dark){document.documentElement.classList.toggle('dark',dark);$('#theme').textContent=dark?'☀':'☾';$('#theme').setAttribute('aria-pressed',String(dark));try{localStorage.setItem('reading-room:theme',dark?'dark':'light');}catch{}}
$('#theme').onclick=()=>theme(!document.documentElement.classList.contains('dark'));try{theme(localStorage.getItem('reading-room:theme')==='dark');}catch{}
$('#dialog').onclick=e=>{if(e.target.closest('[data-close]'))$('#dialog').close();};
$('#settings').onclick=()=>{dialog('<h2>Góc luyện Listening</h2><p>60 test · Cambridge 7–21 · 2.400 câu hỏi. Đề hiển thị dạng văn bản tự xuống dòng, đã lọc dòng quảng bá và đường link. 56 test có khóa chấm; Cambridge 20 thiếu khóa trong PDF đầu vào.</p><p class="hint">Tiến độ Listening lưu riêng với Reading.</p><div class="toolbar"><button id="export">Xuất tiến độ JSON</button><label class="button" for="import">Khôi phục JSON</label><input type="file" id="import" accept=".json" hidden><button id="reset">Làm lại test</button></div><p class="hint">Nhập chữ cái cho trắc nghiệm/matching. Nhóm IN EITHER ORDER được chấm không phụ thuộc thứ tự và không tính trùng. Chấm tham khảo bỏ qua hoa/thường, dấu cách và gạch nối; kiểm tra giới hạn từ theo đề gốc.</p>','<button data-close>Đóng</button>');$('#export').onclick=()=>{persist();const url=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='listening-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};$('#import').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>10000000)throw Error('File quá lớn.');const imported=cleanStore(JSON.parse(await f.text()));pause();db=imported;current=TESTS.find(t=>t.id===db.current);part=db.part;tab='sheet';persist();$('#dialog').close();render();toast('Đã khôi phục Listening.');}catch(err){toast(err.message);}};$('#reset').onclick=()=>{pause();$('#dialog').close();dialog('<h2>Làm lại test?</h2><p>Câu trả lời, điểm và cờ xem lại của test này sẽ được đặt lại.</p>','<button data-close>Quay lại</button><button class="primary" id="confirm-reset">Làm lại</button>');$('#confirm-reset').onclick=()=>{const duration=state().duration,highlights=state().highlights;db.states[current.id]=fresh();state().highlights=highlights;state().duration=duration;state().remaining=duration;part=1;tab='sheet';$('#dialog').close();persist();render();};};};
