<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reading Room · Listening</title><style>
:root{color-scheme:light;--bg:#f3f6fc;--paper:#fff;--ink:#223451;--muted:#647795;--line:#dce4f0;--accent:#456be6;--soft:#eaf0ff;--good:#177551;--bad:#b63849}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,sans-serif}html.dark{color-scheme:dark;--bg:#101b2d;--paper:#19263b;--ink:#e1e9fa;--muted:#a6b6d1;--line:#344663;--accent:#92acff;--soft:#273b61;--good:#7fe0b8;--bad:#ffa6b0}button,select,input{font:inherit;outline-offset:3px}button,select,.button{border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--paper);color:var(--ink)}button,.button{cursor:pointer}button:disabled{opacity:.5;cursor:default}a{color:var(--accent);text-decoration:none}.primary{background:#456be6;color:#fff;border-color:#456be6}.top{height:76px;display:flex;align-items:center;gap:20px;padding:0 28px;border-bottom:1px solid var(--line);background:var(--paper)}.brand{font-size:20px;font-weight:750;letter-spacing:-.8px}.skill-nav{display:flex;gap:8px}.skill-nav a{padding:6px 12px;border-radius:6px;color:var(--muted)}.skill-nav .active{background:var(--soft);color:var(--accent)}.selectors{margin-left:auto;display:flex;gap:8px}.session{display:flex;align-items:center;gap:12px;padding:13px 28px;background:var(--paper);border-bottom:1px solid var(--line)}.parts{display:flex;gap:7px;margin-right:auto}.active{background:var(--soft);color:var(--accent);border-color:var(--accent)}.timer{font-size:23px;font-variant-numeric:tabular-nums;font-weight:700;min-width:72px}.low{color:var(--bad)}main{display:grid;grid-template-columns:minmax(0,1fr) minmax(330px,.72fr);height:calc(100dvh - 228px)}.pane{min-width:0;display:flex;flex-direction:column;background:var(--paper)}.source-pane{border-right:1px solid var(--line)}.pane-bar{display:flex;align-items:center;gap:10px;padding:12px 22px;border-bottom:1px solid var(--line);min-height:55px}.pane-bar small{margin-right:auto;color:var(--muted)}.scroll{overflow:auto;flex:1;padding:22px}.pages{width:100%;margin:auto}.pages img{display:block;width:100%;height:auto;border:1px solid #ccd5e2;background:white}.pages figure{margin:0 0 22px}.pages figcaption{padding:7px 2px;color:var(--muted);font-size:11px}.eyebrow{color:var(--muted);font-size:11px;letter-spacing:1.5px;font-weight:650}h1{font-size:25px;letter-spacing:-.7px;margin:6px 0 16px}.hint,.notice{font-size:12px;color:var(--muted)}.notice{padding:12px 15px;background:var(--soft);border-radius:8px;margin:14px 0}.warn{border-left:3px solid #ce982f}.audio-panel{padding:15px;border:1px solid var(--line);border-radius:10px;margin-bottom:20px}.audio-panel audio{width:100%;height:42px;display:block;margin:10px 0}.audio-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.audio-tools select,.audio-tools .button{font-size:12px;padding:5px 9px}.audio-status{font-size:11px;color:var(--muted);overflow-wrap:anywhere}.tabs{display:flex;gap:6px;margin-bottom:18px}.tabs button{flex:1}.answer-row{display:grid;grid-template-columns:34px minmax(0,1fr) 36px;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.answer-row label{font-weight:700;color:var(--muted)}.answer-row input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:7px;color:var(--ink);padding:10px}.flag{padding:6px;border:0;background:transparent;color:var(--muted)}.flag.on{color:#c68a1c}.answer-row.correct input{border-color:var(--good)}.answer-row.wrong input{border-color:var(--bad)}.feedback{grid-column:2/4;font-size:12px;color:var(--muted);overflow-wrap:anywhere}.correct .feedback{color:var(--good)}.wrong .feedback{color:var(--bad)}.score{font-size:32px;font-weight:750;margin:12px 0}.key-image{width:100%;height:auto;background:#fff}.footer{min-height:97px;border-top:1px solid var(--line);padding:12px 28px;background:var(--paper);display:flex;gap:18px;align-items:center}.palette{display:grid;grid-template-columns:repeat(20,1fr);gap:4px;flex:1}.palette button{padding:4px 0;font-size:11px;border-radius:5px}.palette .filled{background:var(--soft)}.palette .current{outline:2px solid var(--accent);outline-offset:0}.palette .flagged{box-shadow:inset 0 -3px #d19a34}.palette .correct{border-color:var(--good);color:var(--good)}.palette .wrong{border-color:var(--bad);color:var(--bad)}.footer-copy{min-width:130px;font-size:11px;color:var(--muted)}details{margin:16px 0}summary{cursor:pointer;color:var(--accent)}pre{white-space:pre-wrap;font:13px/1.6 system-ui;overflow-wrap:anywhere}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin:15px 0}dialog{color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:14px;max-width:520px;width:92vw;padding:26px}dialog::backdrop{background:#0b173280}.dialog-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:22px}#toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:#273e64;color:#fff;padding:12px 18px;border-radius:10px;z-index:20;max-width:90vw}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
body{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;height:100dvh}main{height:auto;min-height:0}.pane,.scroll{min-height:0}
@media(max-width:1100px){.top{padding:0 14px;gap:10px}.brand{font-size:17px}.session{padding:12px 14px;gap:7px}.parts button{padding:7px 8px}.scroll{padding:16px}.pane-bar{padding:10px 14px}.footer{padding:10px 14px;gap:10px}.footer-copy{min-width:100px}.skill-nav a{padding:6px 8px}}@media(max-width:760px){body{display:block;height:auto}.top{height:auto;min-height:100px;flex-wrap:wrap;padding:12px;gap:8px}.selectors{width:100%;margin:0;justify-content:space-between}.selectors select{max-width:45%}.session{flex-wrap:wrap}.parts{width:100%;margin:0}.parts button{flex:1}main{height:auto;display:block}.source-pane{height:65dvh;border-right:0;border-bottom:1px solid var(--line)}.answer-pane{min-height:500px}.answer-pane .scroll{overflow:visible}.footer{position:sticky;bottom:0;z-index:5;min-height:100px}.palette{grid-template-columns:repeat(10,1fr)}.footer-copy{display:none}.top .skill-nav{margin-left:auto}h1{font-size:21px}}
</style></head><body><header class="top"><a class="brand" href="index.html">Reading Room.</a><nav class="skill-nav" aria-label="Kỹ năng"><a href="index.html">Reading</a><a class="active" href="listening.html" aria-current="page">Listening</a><a href="listening-youtube.html">YouTube practice</a></nav><div class="selectors"><label class="sr" for="book">Chọn sách</label><select id="book"></select><label class="sr" for="test">Chọn test</label><select id="test"></select><button id="theme" aria-label="Đổi sáng tối">☾</button><button id="settings" aria-label="Cài đặt và sao lưu">⚙</button></div></header><section class="session"><nav class="parts" id="parts" aria-label="Phần bài nghe"></nav><label class="sr" for="duration">Thời gian làm bài</label><select id="duration" title="Chọn trước khi bắt đầu"></select><span class="timer" id="timer">30:00</span><button id="timer-toggle" aria-label="Bắt đầu đồng hồ">▶</button><button class="primary" id="submit">Nộp bài</button></section><main><section class="pane source-pane"><div class="pane-bar"><small id="source-caption"></small><button id="zoom-out" aria-label="Thu nhỏ">−</button><button id="zoom-in" aria-label="Phóng to">+</button></div><div class="scroll" id="source-scroll"><div class="pages" id="pages"></div></div></section><section class="pane answer-pane"><div class="pane-bar"><small>IELTS LISTENING · PHIẾU TRẢ LỜI</small><span id="progress"></span></div><div class="scroll" id="answer-scroll"><div class="eyebrow" id="eyebrow"></div><h1>Listen. Notice. Understand.</h1><div class="audio-panel"><b id="audio-title">Bài nghe</b><audio id="audio" controls preload="none"></audio><div class="audio-tools"><label>Tốc độ <select id="rate"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option></select></label><label class="button" for="audio-file">Chọn audio từ máy</label><input id="audio-file" type="file" accept="audio/*,.mp3,.m4a,.mp4" hidden></div><p class="audio-status" id="audio-status"></p></div><div class="tabs"><button id="tab-sheet" class="active">Làm bài</button><button id="tab-key">Đáp án &amp; đối chiếu</button></div><div id="content"></div></div></section></main><footer class="footer"><div class="footer-copy"><b>QUESTION PALETTE</b><br>● Đã trả lời · vàng: xem lại<br>Tự động lưu trên máy</div><nav class="palette" id="palette" aria-label="Chuyển câu hỏi"></nav></footer><dialog id="dialog"><div id="dialog-content"></div></dialog><div id="toast" role="status" hidden></div><script>
'use strict';
const TESTS=/*__LISTENING_DATA__*/;
const STORE='reading-room:listening:v1',RELEASE='https://github.com/HQD19/Ielts-reading/releases/download/listening-audio-v1/';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[’']/g,'').replace(/(?<=\d),(?=\d)/g,'').replace(/[\s\-–—]+/g,'').replace(/[.!?;:]+$/,'');
const fresh=()=>({answers:{},flags:[],duration:1800,remaining:1800,started:false,running:false,deadline:null,graded:false,revealed:false,audioTimes:{}});
function cleanState(raw){const s=fresh();if(!raw||typeof raw!=='object')return s;for(let n=1;n<=40;n++)if(typeof raw.answers?.[n]==='string')s.answers[n]=raw.answers[n].slice(0,180);s.flags=Array.isArray(raw.flags)?[...new Set(raw.flags.filter(n=>Number.isInteger(n)&&n>=1&&n<=40))]:[];s.duration=Number.isInteger(raw.duration)&&raw.duration>=600&&raw.duration<=3600&&raw.duration%60===0?raw.duration:1800;s.remaining=Number.isFinite(raw.remaining)?Math.max(0,Math.min(s.duration,raw.remaining)):s.duration;s.started=!!raw.started;s.graded=!!raw.graded;s.revealed=!!raw.revealed;s.running=!!raw.running&&!s.graded&&Number.isFinite(raw.deadline);s.deadline=s.running?raw.deadline:null;for(const [k,v]of Object.entries(raw.audioTimes||{}))if(/^[\w.-]{1,100}$/.test(k)&&Number.isFinite(v)&&v>=0)s.audioTimes[k]=v;return s;}
function cleanStore(raw){const out={version:1,current:TESTS[0].id,part:1,states:{}};if(!raw||raw.version!==1)throw Error('Bản sao lưu không phù hợp.');if(TESTS.some(t=>t.id===raw.current))out.current=raw.current;if([1,2,3,4].includes(raw.part))out.part=raw.part;for(const t of TESTS)if(raw.states?.[t.id])out.states[t.id]=cleanState(raw.states[t.id]);return out;}
let db;try{db=cleanStore(JSON.parse(localStorage.getItem(STORE)));}catch{db=cleanStore({version:1});}
let current=TESTS.find(t=>t.id===db.current),part=db.part,tab='sheet',zoom=100,audioKey='',audioOwner='',objectURL='',toastId,saveFailed=false;
const state=()=>db.states[current.id]??=fresh(),remaining=()=>state().running?Math.max(0,(state().deadline-Date.now())/1000):state().remaining;
const time=s=>String(Math.floor(Math.max(0,s)/60)).padStart(2,'0')+':'+String(Math.floor(Math.max(0,s)%60)).padStart(2,'0');
function toast(text){$('#toast').textContent=text;$('#toast').hidden=false;clearTimeout(toastId);toastId=setTimeout(()=>$('#toast').hidden=true,4000);}
function saveAudioTime(){if(!audioKey||!audioOwner||!Number.isFinite($('#audio').currentTime))return;const s=db.states[audioOwner];if(s)s.audioTimes[audioKey]=$('#audio').currentTime;}
function persist(){db.current=current.id;db.part=part;saveAudioTime();try{localStorage.setItem(STORE,JSON.stringify(db));}catch{if(!saveFailed){saveFailed=true;toast('Không lưu được. Hãy xuất JSON ở Cài đặt.');}}}
function grade(test=current,s=state()){const out={};for(const q of test.answers)out[q.n]=q.answer?!!s.answers[q.n]?.trim()&&q.accept.some(a=>norm(a)===norm(s.answers[q.n])):null;for(const g of test.groups){const available=g.answers.map(norm);for(const n of g.questions){const i=available.indexOf(norm(s.answers[n]));out[n]=i>=0;if(i>=0)available.splice(i,1);}}return out;}
const answered=()=>Object.values(state().answers).filter(v=>v.trim()).length;
function progress(){const s=state(),r=s.graded?grade():{};$('#progress').textContent=answered()+' / 40';$('#palette').innerHTML=Array.from({length:40},(_,i)=>{const n=i+1;return '<button data-q="'+n+'" class="'+(s.answers[n]?.trim()?'filled ':'')+(s.flags.includes(n)?'flagged ':'')+(Math.ceil(n/10)===part?'current ':'')+(s.graded&&r[n]!==null?(r[n]?'correct':'wrong'):'')+'" aria-label="Câu '+n+'">'+n+'</button>';}).join('');}
function tick(){const s=state(),r=remaining();$('#timer').textContent=time(r);$('#timer').classList.toggle('low',r<=120);$('#duration').value=String(s.duration/60);$('#duration').disabled=s.started||s.graded;$('#timer-toggle').textContent=s.running?'Ⅱ':'▶';$('#timer-toggle').disabled=s.graded;$('#timer-toggle').setAttribute('aria-label',s.running?'Tạm dừng đồng hồ':'Bắt đầu hoặc tiếp tục đồng hồ');if(s.running&&r<=0)finish();}
function pause(){if(state().running){state().remaining=remaining();state().running=false;state().deadline=null;}$('#audio').pause();persist();tick();}
function toggleTimer(){const s=state();if(s.graded)return;if(s.running){pause();return;}if(s.remaining<=0){finish();return;}s.started=true;s.running=true;s.deadline=Date.now()+s.remaining*1000;persist();tick();if($('#audio').getAttribute('src'))$('#audio').play().catch(()=>toast('Nhấn nút phát trên trình nghe để tiếp tục.'));}
function dialog(body,actions){$('#dialog-content').innerHTML=body+'<div class="dialog-actions">'+actions+'</div>';$('#dialog').showModal();}
function finish(){const s=state();if(s.graded)return;s.remaining=remaining();s.running=false;s.deadline=null;s.graded=true;$('#audio').pause();persist();tab='key';renderContent();progress();tick();$('#submit').textContent='Xem kết quả';}
function requestSubmit(){if(state().graded){tab='key';renderContent();return;}dialog('<h2>Nộp bài Listening?</h2><p>Đã trả lời '+answered()+'/40 câu. Sau khi nộp, bài được khóa để xem kết quả.</p>','<button data-close>Tiếp tục làm</button><button class="primary" id="confirm-submit">Nộp &amp; xem kết quả</button>');$('#confirm-submit').onclick=()=>{$('#dialog').close();finish();};}
function updateAudio(){const a=current.audio?.find(a=>a.part===part)||current.audio?.find(a=>a.part===0),key=a?.filename||current.id+'-p'+part;$('#audio-title').textContent=a?.part===0?'Audio toàn bộ test':'Audio · Part '+part;if(audioOwner===current.id&&audioKey===key)return;saveAudioTime();$('#audio').pause();if(objectURL){URL.revokeObjectURL(objectURL);objectURL='';}audioOwner=current.id;audioKey=key;$('#audio').removeAttribute('src');$('#audio').load();$('#audio-status').textContent=a?a.label+' · Có thể chọn audio khác từ máy.':'Chưa có audio được ghép cho phần này. Chọn file từ máy để nghe cùng đề.';if(a){$('#audio').src=location.protocol==='file:'?'assets/audio/'+a.filename:RELEASE+encodeURIComponent(a.filename);$('#audio').load();}}
function renderSource(){$('#source-caption').textContent='CAM '+current.book+' · TEST '+current.sourceTest+' · PART '+part+' · CÂU '+(part*10-9)+'–'+part*10;$('#pages').style.width=zoom+'%';$('#pages').innerHTML=current.pages.filter(p=>p.part===part).map(p=>'<figure><img src="'+p.src+'" alt="Đề Listening Cambridge '+current.book+', Test '+current.sourceTest+', Part '+part+', trang PDF '+p.page+'" loading="lazy"><figcaption>PDF '+current.book+'.pdf · Trang '+p.page+'</figcaption><details><summary>Xem văn bản OCR</summary><pre>'+esc(p.text)+'</pre></details></figure>').join('');}
function renderContent(){const s=state(),r=grade();$('#tab-sheet').classList.toggle('active',tab==='sheet');$('#tab-key').classList.toggle('active',tab==='key');if(tab==='sheet'){$('#content').innerHTML='<p class="hint">Đọc đề gốc bên trái và nhập câu trả lời. Với trắc nghiệm/matching, nhập chữ cái. Tuân thủ giới hạn từ trong đề.</p>'+(current.sourceNote?'<div class="notice warn">'+esc(current.sourceNote)+'</div>':'')+current.groups.filter(g=>Math.ceil(g.questions[0]/10)===part).map(g=>'<div class="notice">Câu '+g.questions.join(', ')+': thứ tự bất kỳ; mỗi ô nhập một đáp án.</div>').join('')+'<h2>Part '+part+' · Câu '+(part*10-9)+'–'+part*10+'</h2>'+Array.from({length:10},(_,i)=>{const n=part*10-9+i;return '<div class="answer-row '+(s.graded&&r[n]!==null?(r[n]?'correct':'wrong'):'')+'" id="q-'+n+'"><label for="a-'+n+'">'+n+'</label><input id="a-'+n+'" data-answer="'+n+'" value="'+esc(s.answers[n]||'')+'" maxlength="180" autocomplete="off" spellcheck="false" aria-label="Câu trả lời '+n+'" '+(s.graded?'disabled':'')+'><button class="flag '+(s.flags.includes(n)?'on':'')+'" data-flag="'+n+'" aria-label="Đánh dấu câu '+n+'" aria-pressed="'+s.flags.includes(n)+'">⚑</button>'+(s.graded?'<div class="feedback">'+(r[n]===null?'Chưa có khóa đáp án.':r[n]?'Đúng':'Đáp án: '+esc(current.answers[n-1].answer))+'</div>':'')+'</div>';}).join('');return;}
const count=current.answers.filter(q=>q.answer).length,correct=Object.values(r).filter(x=>x===true).length;
$('#content').innerHTML=(s.graded?'<div class="score">'+correct+' / '+(count||'—')+'</div><p class="hint">'+time(s.duration-s.remaining)+' làm bài · '+answered()+'/40 đã trả lời'+(s.revealed?' · Đã xem đáp án trước khi nộp':'')+'. '+(count<40?'Chỉ chấm các câu có khóa đáp án.':'')+'</p>':'<div class="notice">Lượt luyện này đã được ghi nhận là có xem đáp án.</div>')+(count?'<p class="hint">Khóa chép từ PDF '+current.book+'.pdf, trang '+current.keyPage+'. Ngoặc chỉ phần tùy chọn; dấu / chỉ phương án chấp nhận. Đối chiếu ảnh gốc nếu cần.</p>'+current.groups.map(g=>'<p class="hint">Câu '+g.questions.join(', ')+': <b>'+esc(g.answers.join(' + '))+'</b>, thứ tự bất kỳ.</p>').join('')+current.answers.map(q=>'<div class="answer-row"><b>'+q.n+'</b><span>'+esc(q.answer)+'</span><span>'+(s.graded?(r[q.n]?'✓':'✕'):'')+'</span>'+(s.graded?'<div class="feedback">Bạn trả lời: '+esc(s.answers[q.n]||'—')+'</div>':'')+'</div>').join('')+'<details><summary>Ảnh khóa đáp án gốc · trang '+current.keyPage+'</summary><img class="key-image" src="'+current.keySrc+'" alt="Khóa đáp án gốc Cambridge '+current.book+', Test '+current.sourceTest+'"></details>':'<div class="notice warn">'+esc(current.sourceNote)+'</div>');}
function render(){$('#book').innerHTML=[...new Set(TESTS.map(t=>t.book))].map(b=>'<option value="'+b+'" '+(b===current.book?'selected':'')+'>Cambridge '+b+'</option>').join('');$('#test').innerHTML=TESTS.filter(t=>t.book===current.book).map(t=>'<option value="'+t.id+'" '+(t.id===current.id?'selected':'')+'>Test '+t.sourceTest+'</option>').join('');$('#parts').innerHTML=[1,2,3,4].map(n=>'<button data-part="'+n+'" class="'+(n===part?'active':'')+'" aria-current="'+(n===part?'page':'false')+'">Part '+n+'</button>').join('');$('#eyebrow').textContent='CAMBRIDGE '+current.book+' / TEST '+current.sourceTest;$('#submit').textContent=state().graded?'Xem kết quả':'Nộp bài';renderSource();updateAudio();renderContent();progress();tick();}
function changeTest(id){pause();current=TESTS.find(t=>t.id===id)||current;part=1;tab='sheet';zoom=100;persist();render();$('#source-scroll').scrollTop=0;$('#answer-scroll').scrollTop=0;}
function goPart(n){saveAudioTime();part=n;persist();render();$('#source-scroll').scrollTop=0;$('#answer-scroll').scrollTop=0;}
$('#book').onchange=e=>changeTest(TESTS.find(t=>t.book===+e.target.value).id);$('#test').onchange=e=>changeTest(e.target.value);$('#parts').onclick=e=>{const b=e.target.closest('[data-part]');if(b)goPart(+b.dataset.part);};
$('#content').oninput=e=>{if(e.target.matches('[data-answer]')&&!state().graded){state().answers[e.target.dataset.answer]=e.target.value;persist();progress();}};
$('#content').onclick=e=>{const b=e.target.closest('[data-flag]');if(!b)return;const n=+b.dataset.flag;state().flags=state().flags.includes(n)?state().flags.filter(x=>x!==n):[...state().flags,n];b.classList.toggle('on',state().flags.includes(n));b.setAttribute('aria-pressed',String(state().flags.includes(n)));persist();progress();};
$('#palette').onclick=e=>{const b=e.target.closest('[data-q]');if(!b)return;const n=+b.dataset.q;tab='sheet';if(part!==Math.ceil(n/10))goPart(Math.ceil(n/10));else renderContent();$('#q-'+n).scrollIntoView({block:'center',behavior:'smooth'});$('#a-'+n).focus({preventScroll:true});};
$('#tab-sheet').onclick=()=>{tab='sheet';renderContent();};$('#tab-key').onclick=()=>{if(!state().graded&&!state().revealed){dialog('<h2>Xem đáp án?</h2><p>Lượt luyện này sẽ được đánh dấu là đã xem đáp án. Bạn vẫn có thể tiếp tục làm bài.</p>','<button data-close>Quay lại</button><button class="primary" id="reveal">Xem đáp án</button>');$('#reveal').onclick=()=>{$('#dialog').close();state().revealed=true;persist();tab='key';renderContent();};}else{tab='key';renderContent();}};
$('#duration').innerHTML=Array.from({length:51},(_,i)=>'<option value="'+(i+10)+'">'+(i+10)+' phút</option>').join('');$('#duration').onchange=e=>{if(state().started||state().graded)return;const n=+e.target.value;if(!Number.isInteger(n)||n<10||n>60)return;state().duration=n*60;state().remaining=n*60;persist();tick();};$('#timer-toggle').onclick=toggleTimer;$('#submit').onclick=requestSubmit;
$('#audio-file').onchange=e=>{const f=e.target.files[0];if(!f)return;saveAudioTime();$('#audio').pause();if(objectURL)URL.revokeObjectURL(objectURL);objectURL=URL.createObjectURL(f);audioKey='local-'+part;audioOwner=current.id;$('#audio').src=objectURL;$('#audio').load();$('#audio-status').textContent='Audio từ máy: '+f.name+'. Sau khi tải lại trang cần chọn lại file này.';e.target.value='';};
$('#audio').onloadedmetadata=()=>{const pos=state().audioTimes[audioKey];if(Number.isFinite(pos)&&pos<$('#audio').duration)$('#audio').currentTime=pos;$('#audio').playbackRate=+$('#rate').value;};$('#audio').onerror=()=>{$('#audio-status').textContent='Không tải được audio. Chọn file từ máy hoặc kiểm tra kết nối mạng.';};$('#audio').ontimeupdate=saveAudioTime;$('#rate').onchange=e=>$('#audio').playbackRate=+e.target.value;
$('#zoom-in').onclick=()=>{zoom=Math.min(200,zoom+20);$('#pages').style.width=zoom+'%';};$('#zoom-out').onclick=()=>{zoom=Math.max(80,zoom-20);$('#pages').style.width=zoom+'%';};
function theme(dark){document.documentElement.classList.toggle('dark',dark);$('#theme').textContent=dark?'☀':'☾';$('#theme').setAttribute('aria-pressed',String(dark));try{localStorage.setItem('reading-room:theme',dark?'dark':'light');}catch{}}
$('#theme').onclick=()=>theme(!document.documentElement.classList.contains('dark'));try{theme(localStorage.getItem('reading-room:theme')==='dark');}catch{}
$('#dialog').onclick=e=>{if(e.target.closest('[data-close]'))$('#dialog').close();};
$('#settings').onclick=()=>{dialog('<h2>Góc luyện Listening</h2><p>60 test · Cambridge 7–21 · 2.400 câu hỏi. Đề giữ nguyên bản quét. 56 test có khóa chấm; Cambridge 20 thiếu khóa trong PDF đầu vào.</p><p class="hint">Tiến độ Listening lưu riêng với Reading. Audio tải theo bài nghe đang chọn.</p><div class="toolbar"><button id="export">Xuất tiến độ JSON</button><label class="button" for="import">Khôi phục JSON</label><input type="file" id="import" accept=".json" hidden><button id="reset">Làm lại test</button></div><p class="hint">Nhập chữ cái cho trắc nghiệm/matching. Nhóm IN EITHER ORDER được chấm không phụ thuộc thứ tự và không tính trùng. Chấm tham khảo bỏ qua hoa/thường, dấu cách và gạch nối; kiểm tra giới hạn từ theo đề gốc.</p>','<button data-close>Đóng</button>');$('#export').onclick=()=>{persist();const url=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='listening-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};$('#import').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>10000000)throw Error('File quá lớn.');const imported=cleanStore(JSON.parse(await f.text()));pause();db=imported;current=TESTS.find(t=>t.id===db.current);part=db.part;tab='sheet';audioKey='';audioOwner='';persist();$('#dialog').close();render();toast('Đã khôi phục Listening.');}catch(err){toast(err.message);}};$('#reset').onclick=()=>{pause();$('#dialog').close();dialog('<h2>Làm lại test?</h2><p>Câu trả lời, điểm và cờ xem lại của test này sẽ được đặt lại.</p>','<button data-close>Quay lại</button><button class="primary" id="confirm-reset">Làm lại</button>');$('#confirm-reset').onclick=()=>{const duration=state().duration;db.states[current.id]=fresh();state().duration=duration;state().remaining=duration;part=1;tab='sheet';audioKey='';audioOwner='';$('#dialog').close();persist();render();};};};
window.addEventListener('beforeunload',persist);setInterval(tick,250);setInterval(persist,5000);render();persist();
</script></body></html>
